services:

  api:
    build:
      context: ./api

    container_name: srv-video-api

    restart: always

    env_file:
      - .env

    volumes:
      - ./assets:/app/assets
      - ./output:/app/output
      - ./tmp:/app/tmp

    depends_on:
      - postgres
      - redis

    ports:
      - "8000:8000"


  worker:
    build:
      context: ./worker

    container_name: srv-video-worker

    restart: always

    env_file:
      - .env

    volumes:
      - ./assets:/app/assets
      - ./output:/app/output
      - ./tmp:/app/tmp

    depends_on:
      - redis
      - postgres


  postgres:
    image: postgres:17

    container_name: srv-video-postgres

    restart: always

    environment:
      POSTGRES_USER: video
      POSTGRES_PASSWORD: password
      POSTGRES_DB: video_generator

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7

    container_name: srv-video-redis

    restart: always


  nginx:
    image: nginx:latest

    container_name: srv-video-nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - api



volumes:

  postgres_data: